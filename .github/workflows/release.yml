name: Release AppImage

# Gera tag + release com o AppImage quando um PR da development é mesclado na
# master. O número da versão vem do package.json — lembre de fazer o bump antes
# do merge. Também pode ser disparado manualmente (workflow_dispatch).
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'development')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do projeto
        run: npm ci

      # prepare-bins compila mkntfs e ms-sys dentro de um container Debian 11
      # (glibc 2.31) para que o AppImage rode em distros antigas como Ubuntu 20.04.
      # O docker já vem instalado nos runners do GitHub — nada a instalar aqui.
      - name: Preparar binários embarcados (7zzs, mkntfs, ms-sys)
        run: npm run prepare-bins

      # Falha o build cedo se algum binário exigir glibc mais nova que 2.31 —
      # sem isto, a incompatibilidade só apareceria na máquina do usuário final.
      - name: Verificar portabilidade dos binários embarcados
        run: |
          fail=0
          for f in bin/*; do
            v=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            libs=$(ldd "$f" 2>/dev/null | grep -oE 'lib[a-z0-9._+-]+\.so\.[0-9]+' | sort -u | tr '\n' ' ')
            echo "$f -> glibc ${v:-estático} | libs ${libs:-nenhuma}"
            if [ -n "$v" ] && [ "$(printf '%s\n2.31\n' "$v" | sort -V | tail -1)" != "2.31" ]; then
              echo "::error file=$f::exige glibc $v (máximo permitido: 2.31)"; fail=1
            fi
            if echo "$libs" | grep -qE 'libntfs-3g|libfuse'; then
              echo "::error file=$f::depende de $libs, que o usuário final pode não ter"; fail=1
            fi
          done
          exit $fail

      # --publish never: em CI o electron-builder tenta auto-publicar no GitHub
      # e falha sem token; quem publica é o passo "Publicar release" abaixo
      - name: Gerar AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Ler versão do package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Criar tag da versão (se ainda não existir)
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG já existe — mantendo."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Penguaçu-Flash ${{ steps.ver.outputs.version }}"
            git push origin "$TAG"
          fi

      - name: Publicar release com o AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APP=$(ls dist/*.AppImage)
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG já existe — atualizando o artefato."
            gh release upload "$TAG" "$APP" --clobber
          else
            gh release create "$TAG" "$APP" \
              --title "Penguaçu-Flash ${{ steps.ver.outputs.version }}" \
              --generate-notes
          fi
